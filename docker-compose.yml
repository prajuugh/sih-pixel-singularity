services:
  # 1. Python 4-Agent Optimization Microservice
  agent-service:
    build:
      context: ./backend
      dockerfile: agent-service/Dockerfile
    container_name: rbps-agent-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5001
      - BACKEND_URL=http://backend:5000
      - OPENROUTER_EXPLANATION_MODEL=${OPENROUTER_EXPLANATION_MODEL:-deepseek/deepseek-chat}
      - OPENROUTER_EXPLANATION_TIMEOUT_SECONDS=${OPENROUTER_EXPLANATION_TIMEOUT_SECONDS:-30}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-http://localhost}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-Railway Block Planning System}
    networks:
      - rbps-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 2. Node.js Express REST API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rbps-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      agent-service:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=production
      - LOCAL_STORE_ONLY=true
      - JWT_SECRET=${JWT_SECRET:-railway_block_planning_super_secret_jwt_key_2026}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres.nxyeztucusxactdavrtl:sih-pixal-singularity@aws-0-ap-south-1.pooler.supabase.com:6543/postgres}
      - SUPABASE_URL=${SUPABASE_URL:-https://nxyeztucusxactdavrtl.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - AGENT_SERVICE_URL=http://agent-service:5001
    volumes:
      - ./backend/data:/app/data
    networks:
      - rbps-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 3. React SPA Frontend served by Nginx with reverse proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=/api
        - VITE_AGENT_BASE_URL=http://localhost:5001
    container_name: rbps-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rbps-network

  # 4. Optional Cloudflare Public Tunnel
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rbps-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - rbps-network

networks:
  rbps-network:
    driver: bridge
